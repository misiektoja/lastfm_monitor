[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastfm_monitor"
version = "2.7"
description = "Track Last.fm listening activity in real time with Spotify integration, automated playback, scrobble history and instant notifications"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Michal Szymanski", email = "misiektoja-pypi@rm-rf.ninja" }]
requires-python = ">=3.9"
dependencies = [
  "pylast>=5.2.0",
  "requests>=2.0",
  "python-dateutil>=2.8",
  "pyotp>=2.9.0",
  "spotipy>=2.24.0",
  "python-dotenv>=0.19",
  "beautifulsoup4>=4.9.0",
  # curl_cffi 0.15.0 fixed a redirect-based SSRF and dropped Python 3.9, so 3.9 keeps the last release that supports it
  "curl_cffi>=0.15.0; python_version >= '3.10'",
  "curl_cffi>=0.13.0; python_version < '3.10'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
keywords = ["lastfm", "monitoring", "tracking", "real-time", "osint", "pylast", "spotify"]

[project.optional-dependencies]
test = ["hypothesis>=6.100", "pytest>=7.0", "pyyaml>=6.0"]
# Pinned so a new ruff release cannot fail CI on a rule that did not exist when the change was written
lint = ["ruff==0.16.4"]

[project.urls]
Homepage = "https://github.com/misiektoja/lastfm_monitor"
Source   = "https://github.com/misiektoja/lastfm_monitor"
Changelog= "https://github.com/misiektoja/lastfm_monitor/blob/main/RELEASE_NOTES.md"

[project.scripts]
lastfm_monitor = "lastfm_monitor:main"

[tool.setuptools]
py-modules = ["lastfm_monitor"]
include-package-data = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Defect rules only: syntax errors, pyflakes and bugbear. Formatting and import order are left
# to the surrounding code, which keeps each function definition on one physical line
select = ["E9", "F", "B"]
# Both are style preferences that would rewrite hundreds of existing lines without fixing a defect
ignore = ["F541", "B904"]

[tool.pytest.ini_options]
# Run the in-repo source, never an installed copy, by putting the project root first on sys.path
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
# The offline end-to-end run starts a loopback server and a subprocess, so it is marked for selection
markers = ["e2e: drives the whole CLI against a local Last.fm fixture"]
